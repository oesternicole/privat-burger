
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MC Blumenweg</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff5e6;
 color:#30291f;
}
header{
 background:#bb2929;
 color:white;
 text-align:center;
 padding:20px 12px;
}
header h1{margin:5px 0;font-size:30px}
header p{margin:8px}
main{max-width:780px;margin:auto;padding:12px}
section{
 background:white;
 border-radius:18px;
 padding:18px;
 margin:14px 0;
 box-shadow:0 2px 12px #0001;
}
button{
 border:0;
 border-radius:11px;
 background:#ffd13d;
 color:#211b15;
 padding:12px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:active{opacity:.7}
input,select{
 font:inherit;
 padding:10px;
 border:1px solid #ccc;
 border-radius:10px;
 max-width:100%;
}
input[type=number]{width:70px}
input[type=checkbox]{
 width:22px;
 height:22px;
 accent-color:#bd2929;
}
.row{
 display:flex;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 margin:12px 0;
}
.checklist{
 display:flex;
 flex-wrap:wrap;
 gap:8px 15px;
}
.checklist label{
 display:flex;
 align-items:center;
 gap:6px;
 padding:5px 0;
}
.tiles{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.tile{
 border:2px solid #eee;
 border-radius:14px;
 padding:8px;
 text-align:center;
 background:white;
 min-width:0;
}
button.tile{font-size:15px}
.tile.selected{
 border-color:#bd2929;
 background:#fff0d8;
}
.tile strong{
 display:block;
 margin:8px 0;
 font-size:15px;
}
.picture{
 width:100%;
 aspect-ratio:1.05;
 border-radius:10px;
 background-color:#fff9f1;
 background-image:var(--sheet);
 background-repeat:no-repeat;
 background-size:var(--sw) var(--sh);
 background-position:var(--px) var(--py);
}
.count{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:10px;
}
.count button{min-width:40px}
.item{
 border-bottom:1px solid #ddd;
 padding:12px 0;
}
small{color:#666}
[hidden]{display:none!important}
@media(min-width:600px){
 .tiles{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header>
<h1>🍔 MC Blumenweg</h1>
<p>Gratis bestellen</p>
<button onclick="show('order')">Bestellen</button>
<button onclick="show('kitchen')">👨‍🍳 Küche</button>
</header>

<main>
<div id="order">

<section>
<h2>Dein Name</h2>
<input id="name" placeholder="Name eingeben">
</section>

<section>
<h2>🍔 Burger</h2>
<div id="burgers" class="tiles"></div>

<h3>Zutaten</h3>
<div id="ingredients" class="checklist">
<label><input type="checkbox" value="Gurken" checked>Gurken</label>
<label><input type="checkbox" value="Zwiebeln" checked>Zwiebeln</label>
<label><input type="checkbox" value="Salat" checked>Salat</label>
<label><input type="checkbox" value="Tomaten" checked>Tomaten</label>
<label><input type="checkbox" value="Käse" checked>Käse</label>
</div>

<h3>Saucen</h3>
<div id="sauces" class="checklist">
<label><input type="checkbox" value="BigMac Sauce">BigMac Sauce</label>
<label><input type="checkbox" value="Cocktail">Cocktail</label>
<label><input type="checkbox" value="Ketchup">Ketchup</label>
<label><input type="checkbox" value="Mayonnaise">Mayonnaise</label>
</div>

<div class="row">
<label>Anzahl <input id="burgerQty" type="number" min="1" max="20" value="1"></label>
<button onclick="addBurger()">Burger hinzufügen</button>
</div>
</section>

<section>
<h2>🍗 Chicken Nuggets</h2>
<div id="nuggetPicture"></div>
<div class="row">
<label>Anzahl <input id="nuggetsQty" type="number" min="1" max="20" value="1"></label>
<button onclick="addSimple('Chicken Nuggets','nuggetsQty')">Hinzufügen</button>
</div>
</section>

<section>
<h2>🍟 Pommes</h2>
<div id="friesPicture"></div>
<div class="row">
<label>Anzahl <input id="friesQty" type="number" min="1" max="20" value="1"></label>
<button onclick="addSimple('Pommes','friesQty')">Hinzufügen</button>
</div>
</section>

<section>
<h2>🥤 Getränke</h2>
<p>Tippe auf dein Getränk:</p>
<div id="drinks" class="tiles"></div>
<div class="row">
<label>Anzahl <input id="drinkQty" type="number" min="1" max="20" value="1"></label>
<button onclick="addDrink()">Getränk hinzufügen</button>
</div>
</section>

<section>
<h2>🍨 Dessert</h2>
<p>Wähle deine Eiskugeln. Mischen ist möglich!</p>
<div id="ice" class="tiles"></div>

<h3>Toppings</h3>
<div id="toppings" class="tiles"></div>
<div class="row">
<button onclick="addIce()">Eis hinzufügen</button>
</div>
</section>

<section>
<h2>🛒 Warenkorb</h2>
<div id="cart">Noch leer</div>
<div class="row">
<button onclick="submitOrder()">Bestellung abschicken</button>
</div>
<p id="message"></p>
</section>
</div>

<div id="kitchen" hidden>
<section>
<h2>👨‍🍳 Küchenbestellungen</h2>
<p><small>Aktuell nur auf diesem Gerät gespeichert.</small></p>
<div id="orders"></div>
</section>
</div>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);

const imageFile=
"file_00000000cff8820aa18156f7f4672433.png";

const sheetUrl="./"+imageFile;

/*
 Bildtafel:
 4 Bilder oben,
 5 Bilder in der Mitte,
 6 Bilder unten.
 Die Ausschnitte werden per CSS angezeigt.
*/
const positions={
 Chickenburger:[0,0,4,3],
 Beafburger:[1,0,4,3],
 "Chicken Nuggets":[2,0,4,3],
 Pommes:[3,0,4,3],
 "Coca-Cola":[0,1,5,3],
 Fanta:[1,1,5,3],
 Eistee:[2,1,5,3],
 "Wasser mit Kohlensäure":[3,1,5,3],
 "Wasser ohne Kohlensäure":[4,1,5,3],
 Vanille:[0,2,6,3],
 Schoko:[1,2,6,3],
 Kaffee:[2,2,6,3],
 Streusel:[3,2,6,3],
 Ovo:[4,2,6,3],
 Rahm:[5,2,6,3]
};

function picture(name){
 const p=positions[name];
 if(!p)return "";
 const [col,row,cols,rows]=p;
 const x=cols===1?0:col/(cols-1)*100;
 const y=rows===1?0:row/(rows-1)*100;
 return '<div class="picture" role="img" aria-label="'+
 esc(name)+'" style="'+
 '--sheet:url(&quot;'+sheetUrl+'&quot;);'+
 '--sw:'+cols*100+'%;'+
 '--sh:'+rows*100+'%;'+
 '--px:'+x+'%;--py:'+y+'%"></div>';
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

const cart=[];
const storageKey="mcblumenweg_orders";
let burger="Chickenburger";
let drink="Coca-Cola";

const burgerNames=["Chickenburger","Beafburger"];
const drinkNames=[
 "Coca-Cola","Fanta","Eistee",
 "Wasser mit Kohlensäure",
 "Wasser ohne Kohlensäure"
];
const iceNames=["Vanille","Schoko","Kaffee"];
const toppingNames=["Streusel","Ovo","Rahm"];
const iceCounts={Vanille:0,Schoko:0,Kaffee:0};
const toppings=new Set();

function renderChoices(id,names,selected,fn){
 $(id).innerHTML=names.map((name,i)=>
 '<button class="tile '+
 (name===selected?'selected':'')+
 '" onclick="'+fn+'('+i+')">'+
 picture(name)+
 '<strong>'+esc(name)+'</strong></button>'
 ).join("");
}

function chooseBurger(i){
 burger=burgerNames[i];
 renderChoices("burgers",burgerNames,burger,"chooseBurger");
}

function chooseDrink(i){
 drink=drinkNames[i];
 renderChoices("drinks",drinkNames,drink,"chooseDrink");
}

function renderIce(){
 $("ice").innerHTML=iceNames.map((n,i)=>
 '<div class="tile">'+picture(n)+
 '<strong>'+esc(n)+'</strong>'+
 '<div class="count">'+
 '<button onclick="changeIce('+i+',-1)">−</button>'+
 '<b>'+iceCounts[n]+'</b>'+
 '<button onclick="changeIce('+i+',1)">+</button>'+
 '</div></div>'
 ).join("");
}

function changeIce(i,d){
 const n=iceNames[i];
 iceCounts[n]=Math.max(0,Math.min(20,iceCounts[n]+d));
 renderIce();
}

function renderToppings(){
 $("toppings").innerHTML=toppingNames.map((n,i)=>
 '<label class="tile '+(toppings.has(n)?'selected':'')+'">'+
 picture(n)+
 '<strong>'+esc(n)+'</strong>'+
 '<input type="checkbox" '+
 (toppings.has(n)?'checked':'')+
 ' onchange="toggleTopping('+i+',this.checked)">'+
 '</label>'
 ).join("");
}

function toggleTopping(i,checked){
 const n=toppingNames[i];
 if(checked)toppings.add(n);
 else toppings.delete(n);
 renderToppings();
}

function checked(id){
 return [...$(id).querySelectorAll("input:checked")]
 .map(x=>x.value);
}

function qty(id){
 return Math.max(1,Math.min(20,
 Math.floor(Number($(id).value)||1)));
}

function add(item){
 cart.push(item);
 renderCart();
 $("message").textContent="Zum Warenkorb hinzugefügt.";
}

function addBurger(){
 add({
 name:burger,
 qty:qty("burgerQty"),
 details:"Zutaten: "+
 (checked("ingredients").join(", ")||"keine")+
 " | Saucen: "+
 (checked("sauces").join(", ")||"keine")
 });
}

function addSimple(name,id){
 add({name,qty:qty(id),details:""});
}

function addDrink(){
 add({name:drink,qty:qty("drinkQty"),details:""});
}

function addIce(){
 const balls=iceNames.filter(n=>iceCounts[n]>0)
 .map(n=>iceCounts[n]+"× "+n);
 if(!balls.length){
 alert("Bitte mindestens eine Eiskugel wählen.");
 return;
 }
 add({
 name:"Glace",
 qty:1,
 details:balls.join(" + ")+" | Toppings: "+
 ([...toppings].join(", ")||"keine")
 });
 iceNames.forEach(n=>iceCounts[n]=0);
 toppings.clear();
 renderIce();
 renderToppings();
}

function renderCart(){
 $("cart").innerHTML=cart.length?
 cart.map((x,i)=>
 '<div class="item"><b>'+x.qty+'× '+
 esc(x.name)+'</b><p><small>'+
 esc(x.details)+'</small></p>'+
 '<button onclick="removeItem('+i+')">Entfernen</button></div>'
 ).join(""):"Noch leer";
}

function removeItem(i){
 cart.splice(i,1);
 renderCart();
}

function loadOrders(){
 try{
 const data=JSON.parse(localStorage.getItem(storageKey)||"[]");
 return Array.isArray(data)?data:[];
 }catch(e){return []}
}

function saveOrders(orders){
 localStorage.setItem(storageKey,JSON.stringify(orders));
}

function submitOrder(){
 const name=$("name").value.trim();
 if(!name){
 alert("Bitte Namen eingeben.");
 return;
 }
 if(!cart.length){
 alert("Bitte zuerst Produkte hinzufügen.");
 return;
 }
 try{
 const orders=loadOrders();
 orders.unshift({
 id:Date.now(),
 name,
 items:cart.map(x=>({...x})),
 status:"Neu",
 time:new Date().toLocaleString("de-CH")
 });
 saveOrders(orders);
 cart.length=0;
 renderCart();
 $("message").textContent="Bestellung gespeichert!";
 renderOrders();
 }catch(e){
 alert("Speichern fehlgeschlagen.");
 }
}

function renderOrders(){
 $("orders").innerHTML=loadOrders().map(o=>
 '<div class="item"><h3>'+esc(o.name)+
 ' – '+esc(o.status)+'</h3>'+
 '<small>'+esc(o.time)+'</small>'+
 o.items.map(x=>
 '<p>'+x.qty+'× '+esc(x.name)+
 '<br><small>'+esc(x.details)+'</small></p>'
 ).join("")+
 '<div class="row">'+
 '<button onclick="setStatus('+o.id+',0)">In Zubereitung</button>'+
 '<button onclick="setStatus('+o.id+',1)">Fertig</button>'+
 '</div></div>'
 ).join("")||"Noch keine Bestellungen";
}

function setStatus(id,s){
 saveOrders(loadOrders().map(o=>
 o.id===id?{
 ...o,status:s===0?"In Zubereitung":"Fertig"
 }:o
 ));
 renderOrders();
}

function show(page){
 $("order").hidden=page!=="order";
 $("kitchen").hidden=page!=="kitchen";
 if(page==="kitchen")renderOrders();
 window.scrollTo(0,0);
}

$("nuggetPicture").innerHTML=
 '<div style="max-width:180px">'+
 picture("Chicken Nuggets")+'</div>';
$("friesPicture").innerHTML=
 '<div style="max-width:180px">'+
 picture("Pommes")+'</div>';

chooseBurger(0);
chooseDrink(0);
renderIce();
renderToppings();
renderCart();
renderOrders();
</script>
</body>
</html>
